<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ Practice</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><h1>MCQ Practice</h1><p>Interactive quiz app</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">
      <div class="filebox" id="bankBox"></div>
      <div class="total" id="total"></div>
      <button class="linkbtn" id="authBtn"></button>
    </div>
  </aside>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="localInput" accept=".json,application/json" hidden>

<script src="app.js" defer></script>
</body>
</html>
